<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            <a class="text-xl font-semibold text-gray-700" href="#">Sistema de Feedback</a>
            <div>
                <!-- Espacio para el logo -->
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-4">Registrar Feedback</h2>
                <form id="feedback-form">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="collaborator-name">Nombre del Colaborador</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="collaborator-name" type="text" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="po-assigned">PO Asignado</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="po-assigned" type="text" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="feedback-comments">Comentarios</label>
                        <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="feedback-comments" rows="3" required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="feedback-date">Fecha del Feedback</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="feedback-date" type="date" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Checklist de Mejoras</label>
                        <div id="checklist-container">
                            <div class="flex items-center mb-2">
                                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" placeholder="Añadir mejora">
                                <button class="ml-2 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button" onclick="controller.addChecklistItem(this)">Añadir</button>
                            </div>
                        </div>
                    </div>
                    <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Guardar Feedback</button>
                </form>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-4">Historial de Feedback</h2>
                <div class="flex mb-4">
                    <div class="w-1/2 pr-2">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="filter-collaborator">Filtrar por Colaborador</label>
                        <select id="filter-collaborator" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="w-1/2 pl-2">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="filter-period">Filtrar por Período</label>
                        <select id="filter-period" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                            <option value="">Todos</option>
                            <option value="1">Último Mes</option>
                            <option value="3">Últimos 3 Meses</option>
                            <option value="6">Últimos 6 Meses</option>
                        </select>
                    </div>
                </div>
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mb-4" onclick="controller.filterFeedback()">Filtrar</button>
                <button class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mb-4" onclick="controller.exportToExcel()">Exportar a Excel</button>
                <div id="summary-container" class="mb-4"></div>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead class="bg-gray-800 text-white">
                            <tr>
                                <th class="w-1/6 text-left py-3 px-4 uppercase font-semibold text-sm">Colaborador</th>
                                <th class="w-1/6 text-left py-3 px-4 uppercase font-semibold text-sm">PO Asignado</th>
                                <th class="w-1/3 text-left py-3 px-4 uppercase font-semibold text-sm">Comentarios</th>
                                <th class="text-left py-3 px-4 uppercase font-semibold text-sm">Fecha</th>
                                <th class="text-left py-3 px-4 uppercase font-semibold text-sm">Mejoras</th>
                                <th class="text-left py-3 px-4 uppercase font-semibold text-sm">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="feedback-history" class="text-gray-700">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.16.9/xlsx.full.min.js"></script>
    <script src="feedbackModel.js"></script>
    <script src="feedbackController.js"></script>
    <script>
        const model = new FeedbackModel();
        const controller = new FeedbackController(model);
    </script>
</body>
</html>
